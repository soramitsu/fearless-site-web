name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Branch flow audit
        run: |
          bash ./scripts/test-branch-flow-audit.sh
          bash ./scripts/audit-branch-flow.sh

      - name: Audit public artifacts
        run: ./scripts/audit-public-artifacts.sh

      - name: TODO debt audit
        run: |
          bash ./scripts/test-todo-debt-audit.sh
          bash ./scripts/audit-todo-debt.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Production dependency audit
        run: yarn npm audit --environment production

      - name: Verify release content
        run: yarn verify:release-content

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
