name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Branch flow audit
        run: |
          bash ./scripts/test-branch-flow-audit.sh
          bash ./scripts/audit-branch-flow.sh

      - name: Audit public artifacts
        run: ./scripts/audit-public-artifacts.sh

      - name: TODO debt audit
        run: |
          bash ./scripts/test-todo-debt-audit.sh
          bash ./scripts/audit-todo-debt.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Dependency audits
        run: |
          yarn audit:dependencies
          yarn audit:dependencies:production

      - name: Verify release content
        run: yarn verify:release-content

      - name: Verify app association contracts
        run: |
          yarn test:app-associations
          yarn verify:app-associations

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
